  on_boot:
    then:
      - lvgl.slider.update:
          id: screen_timeout_slider
          value: !lambda return id(user_screen_timeout_steps);
      - lvgl.slider.update:
          id: max_screen_brightness_slider
          value: !lambda return static_cast<int>(id(user_max_brightness) * 100.0f);
      - lvgl.checkbox.update:
          id: ice_alert_sleep_checkbox
          state:
            checked: !lambda return id(ice_alert_sleep_disabled);
