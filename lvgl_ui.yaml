            id: lv_label_31
            x: 10
            y: 104
            height: 15
            text: "Screen Timeout"
            text_color: 0xFFFFFF

        - label:
            id: widget_1791883851644_n112jxq6z
            x: 10
            y: 45
            height: 15
            text: "Screen Brightness"
            text_color: 0xFFFFFF

        - slider:
            id: screen_timeout_slider
            x: 30
            y: 138
            width: 260
            height: 20
            value: 2
            min_value: 0
            max_value: 10
            radius: 9999
            on_value:
              - globals.set:
                  id: user_screen_timeout_steps
                  value: !lambda return static_cast<int>(x);

        - slider:
            id: max_screen_brightness_slider
            x: 30
            y: 70
            width: 260
            height: 20
            value: 100
            min_value: 10
            max_value: 150
            radius: 9999
            on_value:
              - globals.set:
                  id: user_max_brightness
                  value: !lambda return static_cast<float>(x) / 100.0f;

        - checkbox:
            id: ice_alert_sleep_checkbox
            x: 10
            y: 180
            text: "Disable ice alert at night"
            pad_column: 10
            text_color: 0xFFFFFF
            on_value:
              - globals.set:
                  id: ice_alert_sleep_disabled
                  value: !lambda return x;
              - lambda: weather_station::check_ice_alert(
                  id(ha_outside_temp).state, id(ice_alert_led), x);

        - button:
