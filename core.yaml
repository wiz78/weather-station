# Keep the clock widgets as plain text in lvgl_ui.yaml so the visual editor can
# import them. ESPHome applies these runtime-formatted values from HA time.
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_time
          text:
            time_format: "%H:%M"
            time: ha_time
      - lvgl.label.update:
          id: clock_seconds
          text:
            time_format: "%S"
            time: ha_time
      - lvgl.label.update:
          id: clock_date
          text:
            time_format: "%d/%m/%Y"
            time: ha_time

  - interval: 1min
    then:
      - if:
          condition:
            lambda: return id(room_presence).state;
          then:
            - globals.set:
                id: last_burn_in_noise_ms
                value: !lambda return millis();
          else:
            - if:
                condition:
                  lambda: return id(user_screen_timeout_steps) == 0 &&
                    !id(display_is_asleep) &&
                    static_cast<uint32_t>(millis() - id(last_burn_in_noise_ms)) >= 3600000UL;
                then:
                  - script.execute: display_burn_in_noise
